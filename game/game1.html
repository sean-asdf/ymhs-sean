
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두더지 잡기 게임</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf5e9;
            text-align: center;
            color: #333;
            padding: 25px 15px;
        }

        h1 {
            color: #356b3e;
            margin-bottom: 25px;
        }

        .info {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-box {
            background: white;
            border-radius: 15px;
            padding: 12px 20px;
            min-width: 95px;
            box-shadow: 0 3px 8px #00000015;
        }

        .info-box p {
            margin: 0 0 8px;
            font-size: 14px;
            color: #777;
        }

        .info-box span {
            font-size: 25px;
            font-weight: bold;
            color: #356b3e;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 360px;
            margin: 0 auto 25px;
        }

        .hole {
            aspect-ratio: 1 / 1;
            border: none;
            border-radius: 50%;
            background: #93613f;
            box-shadow: inset 0 8px 0 #70452c;
            font-size: 48px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .hole:active {
            transform: scale(0.95);
        }

        .hole.active {
            background: #b77b4e;
        }

        #startBtn {
            border: none;
            background: #45a45b;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
        }

        #startBtn:disabled {
            background: #999;
            cursor: default;
        }

        #message {
            margin-top: 20px;
            font-size: 17px;
            font-weight: bold;
            color: #356b3e;
        }

        @media (max-width: 400px) {
            .game-board {
                gap: 9px;
            }

            .hole {
                font-size: 40px;
            }

            .info-box {
                min-width: 85px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>🐹 두더지 잡기!</h1>

    <div class="info">

        <div class="info-box">
            <p>점수</p>
            <span id="score">0</span>
        </div>

        <div class="info-box">
            <p>남은 시간</p>
            <span id="time">30</span>
        </div>

        <div class="info-box">
            <p>최고 기록</p>
            <span id="best">0</span>
        </div>

    </div>

    <div class="game-board" id="board">

        <button class="hole"></button>
        <button class="hole"></button>
        <button class="hole"></button>

        <button class="hole"></button>
        <button class="hole"></button>
        <button class="hole"></button>

        <button class="hole"></button>
        <button class="hole"></button>
        <button class="hole"></button>

    </div>

    <button id="startBtn">게임 시작</button>

    <div id="message">
        게임 시작 버튼을 눌러주세요!
    </div>


    <script>

        // 1. HTML 요소 가져오기

        const holes = document.querySelectorAll(".hole");

        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");
        const bestText = document.getElementById("best");

        const startBtn = document.getElementById("startBtn");
        const message = document.getElementById("message");


        // 2. 게임 변수 설정

        let score = 0;
        let time = 30;
        let currentMole = -1;

        let gameRunning = false;

        let moleTimer;
        let countdownTimer;


        // 3. 최고 점수 불러오기

        let bestScore = Number(localStorage.getItem("bestScore")) || 0;

        bestText.textContent = bestScore;


        // 4. 두더지 등장시키기

        function showMole() {

            // 모든 구멍 초기화

            holes.forEach(hole => {
                hole.textContent = "";
                hole.classList.remove("active");
            });

            // 랜덤한 구멍 선택

            let randomIndex;

            do {
                randomIndex = Math.floor(Math.random() * 9);
            } while (randomIndex === currentMole);

            currentMole = randomIndex;

            // 두더지 등장

            holes[currentMole].textContent = "🐹";
            holes[currentMole].classList.add("active");

        }


        // 5. 두더지 클릭 이벤트

        holes.forEach((hole, index) => {

            hole.addEventListener("click", () => {

                if (!gameRunning) return;

                if (index === currentMole) {

                    // 점수 증가

                    score++;

                    scoreText.textContent = score;

                    // 두더지 숨기기

                    hole.textContent = "";
                    hole.classList.remove("active");

                    currentMole = -1;

                    // 최고 점수 갱신

                    if (score > bestScore) {

                        bestScore = score;

                        bestText.textContent = bestScore;

                        localStorage.setItem(
                            "bestScore",
                            bestScore
                        );

                    }

                }

            });

        });


        // 6. 게임 시작

        function startGame() {

            score = 0;
            time = 30;

            scoreText.textContent = score;
            timeText.textContent = time;

            gameRunning = true;

            startBtn.disabled = true;

            message.textContent = "두더지를 잡으세요!";

            // 첫 두더지 등장

            showMole();

            // 일정 간격으로 두더지 변경

            moleTimer = setInterval(showMole, 750);

            // 1초마다 시간 감소

            countdownTimer = setInterval(() => {

                time--;

                timeText.textContent = time;

                if (time <= 0) {
                    endGame();
                }

            }, 1000);

        }


        // 7. 게임 종료

        function endGame() {

            gameRunning = false;

            clearInterval(moleTimer);
            clearInterval(countdownTimer);

            holes.forEach(hole => {
                hole.textContent = "";
                hole.classList.remove("active");
            });

            currentMole = -1;

            startBtn.disabled = false;

            message.textContent =
                "게임 종료! 최종 점수: " + score + "점";

            startBtn.textContent = "다시 시작";

        }


        // 8. 시작 버튼 이벤트

        startBtn.addEventListener("click", startGame);

    </script>

</body>
</html>
