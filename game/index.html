<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>MINI ARCADE | 게임 아지트</title>
  <style>
    :root {
      --bg: #101522;
      --panel: #191f30;
      --panel-hover: #222b40;
      --text: #f4f6fb;
      --muted: #a5aec2;
      --line: rgba(255,255,255,.09);
      --accent: #8b7cff;
      --accent-2: #54d6c7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(102, 87, 220, .22), transparent 36%),
        radial-gradient(ellipse at 95% 30%, rgba(40, 177, 164, .12), transparent 30%),
        var(--bg);
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #5b9df5);
      font-size: 20px;
    }

    .header-note {
      color: var(--muted);
      font-size: 13px;
    }

    .hero {
      padding: 66px 0 42px;
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      color: #c9c3ff;
      background: rgba(139,124,255,.13);
      border: 1px solid rgba(139,124,255,.25);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .8px;
    }

    h1 {
      margin: 19px 0 13px;
      font-size: clamp(36px, 7vw, 62px);
      line-height: 1.12;
      letter-spacing: -2px;
    }

    h1 span {
      color: #a99eff;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 0 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.5px;
    }

    .game-count {
      color: var(--muted);
      font-size: 13px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 290px;
      padding: 23px;
      overflow: hidden;
      background: linear-gradient(155deg, rgba(34,43,64,.98), rgba(24,30,46,.98));
      border: 1px solid var(--line);
      border-radius: 20px;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: rgba(169,158,255,.55);
      background: linear-gradient(155deg, #29334c, #1b2337);
    }

    .game-card::after {
      content: "";
      position: absolute;
      width: 145px;
      height: 145px;
      right: -45px;
      top: -45px;
      border-radius: 50%;
      background: var(--glow, rgba(139,124,255,.13));
      filter: blur(2px);
      pointer-events: none;
    }

    .game-icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 22px;
      border-radius: 17px;
      background: var(--icon-bg, rgba(139,124,255,.16));
      font-size: 30px;
    }

    .tag {
      align-self: flex-start;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 7px;
      color: #c9c3ff;
      background: rgba(139,124,255,.13);
      font-size: 11px;
      font-weight: 700;
    }

    .game-card h3 {
      margin: 0 0 9px;
      font-size: 21px;
    }

    .game-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .play-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding: 12px 14px;
      border-radius: 11px;
      color: #fff;
      background: rgba(139,124,255,.2);
      font-size: 14px;
      font-weight: 700;
      transition: background .2s ease;
    }

    .play-link:hover { background: rgba(139,124,255,.36); }
    .arrow { font-size: 18px; }

    .guide {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.035);
    }

    .guide-icon { font-size: 20px; }
    .guide strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .guide p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 46px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: #778198;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .games { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero { padding-top: 52px; }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100% - 28px, 430px); padding-top: 18px; }
      .header-note { display: none; }
      .hero { padding: 46px 0 30px; }
      .hero p { font-size: 14px; }
      .games { grid-template-columns: 1fr; gap: 13px; }
      .game-card { min-height: 250px; padding: 20px; }
      .game-icon { margin-bottom: 17px; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./index.html" aria-label="Mini Arcade 홈">
        <span class="brand-mark">🎮</span>
        <span>MINI ARCADE</span>
      </a>
      <div class="header-note">작은 게임들을 모아둔 나만의 아케이드</div>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">✦ YOUR PERSONAL GAME HUB</div>
        <h1>오늘은 어떤 게임을<br><span>플레이할까요?</span></h1>
        <p>간단하게 즐길 수 있는 미니 게임 모음입니다.<br>
          마음에 드는 게임을 선택해 바로 시작하세요.</p>
      </section>

      <section aria-labelledby="games-title">
        <div class="section-heading">
          <h2 id="games-title">게임 목록</h2>
          <span class="game-count" id="gameCount">GAME 03</span>
        </div>

        <div class="games" id="gameList">
          <!-- 새 게임을 추가할 때는 아래 JavaScript의 games 배열에 항목을 추가하세요. -->
        </div>
      </section>

      <aside class="guide">
        <div class="guide-icon">💡</div>
        <div>
          <strong>게임 추가 방법</strong>
          <p>새 게임 HTML 파일을 이 index.html과 같은 폴더에 넣고, 코드 아래쪽의
            <b>games 배열</b>에 제목·설명·파일명·아이콘을 추가하면 목록에 자동으로 표시됩니다.</p>
        </div>
      </aside>
    </main>

    <footer>
      <span>MINI ARCADE</span>
      <span>PLAY • ENJOY • REPEAT</span>
    </footer>
  </div>

  <script>
    // 게임 추가/수정은 이 배열에서만 하면 됩니다.
    // file 값은 이 index.html과 같은 폴더에 있는 HTML 파일명과 정확히 일치해야 합니다.
    const games = [
      {
        title: "두더지 잡기",
        description: "30초 동안 나타나는 두더지를 빠르게 잡아 최고 점수에 도전하세요.",
        file: "game1.html.html",
        icon: "🐹",
        tag: "SPEED GAME",
        iconBg: "rgba(93, 190, 112, .17)",
        glow: "rgba(93, 190, 112, .18)"
      },
      {
        title: "반응속도 테스트",
        description: "화면이 초록색으로 바뀌는 순간 터치하세요. 5회 평균 반응속도를 측정합니다.",
        file: "game2.html.html",
        icon: "⚡",
        tag: "REACTION",
        iconBg: "rgba(255, 183, 77, .17)",
        glow: "rgba(255, 183, 77, .16)"
      },
      {
        title: "롤 챔피언 퀴즈",
        description: "흐릿한 챔피언 이미지를 보고 4개의 보기 중 정답을 골라보세요. 총 10문제입니다.",
        file: "game3.html.html",
        icon: "⚔️",
        tag: "QUIZ",
        iconBg: "rgba(80, 165, 255, .17)",
        glow: "rgba(80, 165, 255, .17)"
      }
    ];

    const gameList = document.getElementById("gameList");
    const gameCount = document.getElementById("gameCount");

    function renderGames() {
      gameCount.textContent = `GAME ${String(games.length).padStart(2, "0")}`;

      gameList.innerHTML = games.map(game => `
        <article class="game-card"
          style="--icon-bg:${game.iconBg || "rgba(139,124,255,.16)"}; --glow:${game.glow || "rgba(139,124,255,.13)"}">
          <div class="game-icon" aria-hidden="true">${game.icon}</div>
          <span class="tag">${game.tag || "MINI GAME"}</span>
          <h3>${game.title}</h3>
          <p>${game.description}</p>
          <a class="play-link" href="./${encodeURIComponent(game.file)}">
            <span>게임 시작하기</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </article>
      `).join("");
    }

    renderGames();
  </script>
</body>
</html>
